name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ./package.json

      - name: Install dependencies
        run: |
            npm ci

      - name: Build types
        run: |
            npm run build --workspace=types

      - name: Lint
        run: |
            npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ./package.json

      - name: Install dependencies
        run: |
            npm ci

      - name: Build
        run: |
            npm run build --workspace=types
            npm run build --workspace=indexcards

      - name: Typecheck
        run: |
            npm run typecheck

  indexcards:
    name: Indexcards Tests
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12
        env:
          MARIADB_DATABASE: tabroom
          MARIADB_USER: tabroom
          MARIADB_PASSWORD: tabroom
          MARIADB_ROOT_PASSWORD: root
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Copy indexcards config
        run: |
          cp .forgejo/config/config.ci.json indexcards/config/config.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ./package.json

      - name: Install dependencies
        run: |
            npm ci

      - name: Build types
        run: |
            npm run build --workspace=types

      - name: Seed database
        run: |
          mariadb \
            --host=mariadb \
            --port=3306 \
            --user=tabroom \
            --password=tabroom \
            tabroom < ./indexcards/tests/test.sql

      - name: Test Indexcards
        run: |
            npm run test:ci --workspace=indexcards

  schemats:
    name: Schemats Unit Tests
    needs: [lint, typecheck]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ./package.json

      - name: Install dependencies
        run: |
            npm ci

      - name: Build types
        run: |
            npm run build --workspace=types

      - name: Test Schemats (unit)
        run: |
            npm run test:ci:unit --workspace=schemats

  a11y:
    name: A11y Tests
    needs: [lint, typecheck]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ./package.json

      - name: Install dependencies
        run: |
            npm ci

      - name: Build types
        run: |
            npm run build --workspace=types

      # the storybook vitest project only runs chromium
      - name: Install Playwright browsers
        run: |
            npm exec --workspace=schemats -- playwright install --with-deps chromium

      - name: Test Schemats (a11y)
        run: |
            npm run test:ci:a11y --workspace=schemats

  e2e:
    name: E2E Tests
    needs: [lint, typecheck]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: E2E Tests
        run: |
            npm run test --workspace=e2e
