name: tabroom-e2e

# No bind mounts: CI runs compose against a docker-in-docker daemon that can't
# see the job's checkout. Files go in through build contexts or inline configs,
# which compose sends over the docker API.

configs:
  indexcards:
    content: |
      {
        "logging": {
          "level": "error",
          "usePrettyConsole": true
        },
        "db": {
          "host": "tabroomdb-e2e",
          "port": 3307,
          "user": "root",
          "pass": "tabroom",
          "database": "tabroom"
        },
        "cors": {
          "origins": ["http://schemats:3000"]
        },
        "csrf": {
          "trusted_origins": ["http://schemats:3000"]
        }
      }

services:
  tabroomdb-e2e:
    build:
      context: ../indexcards/tests
      dockerfile_inline: |
        FROM mariadb:12
        COPY test.sql /docker-entrypoint-initdb.d/db.sql
    command:
      - --port=3307
    # fresh database, seeded from test.sql, on every run
    tmpfs:
      - /var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: tabroom
      MARIADB_DATABASE: tabroom
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  indexcards:
    build:
      context: ..
      dockerfile: ./indexcards/Dockerfile
      target: prod
    configs:
      - source: indexcards
        target: /config/config.json
    depends_on:
      tabroomdb-e2e:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8001/v1/status').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  schemats:
    build:
      context: ..
      dockerfile: ./schemats/Dockerfile
      target: prod
    env_file:
      - ./config/schemats.env
    ports:
      - "9010:3000"
    depends_on:
      indexcards:
        condition: service_healthy

  e2e:
    build:
      context: ..
      dockerfile: ./e2e/Dockerfile
    # tests create data through the indexcards factories
    configs:
      - source: indexcards
        target: /config/config.json
    environment:
      BASE_URL: http://schemats:3000
      CI: ${CI:-}
    depends_on:
      indexcards:
        condition: service_healthy
      schemats:
        condition: service_started
